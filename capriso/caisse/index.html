  <div class="cursor" aria-hidden="true"><span class="cursor__dot"></span><span class="cursor__label"></span></div>
  <div class="toast" role="status" aria-live="polite"></div>

  <header class="nav">
    <div class="nav__bar glass cz-bar">
      <span class="logo" aria-label="Capriso">
        <svg class="logo__mark" aria-hidden="true"><use href="#cap-mark"/></svg>
        <span class="logo__word" aria-hidden="true"></span>
      </span>
      <span class="cz-bar__tag">Cassa</span>
      <button class="btn btn--line-dark cz-logout" type="button" hidden><svg class="btn__ic" aria-hidden="true"><use href="#i-logout"/></svg><span class="btn__t">Fermer la caisse</span></button>
    </div>
  </header>

  <main id="top" class="cz">
    <!-- connexion caisse -->
    <section class="cz-login glass" hidden aria-labelledby="czl-t">
      <svg class="cz-login__mark" aria-hidden="true"><use href="#cap-mark"/></svg>
      <p class="kicker">Riservato</p>
      <h1 class="h2" id="czl-t">La <em>caisse</em></h1>
      <form class="cz-login__f" novalidate>
        <label class="order__field pw"><span>Mot de passe de la caisse</span><input type="password" name="password" autocomplete="current-password" required><button type="button" class="pw__eye" aria-label="Afficher le mot de passe"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></button></label>
        <p class="form__msg" role="alert"></p>
        <button class="btn btn--wine btn--full" type="submit"><span class="btn__t">Ouvrir la caisse</span><svg class="btn__ic" aria-hidden="true"><use href="#i-arrow"/></svg></button>
      </form>
    </section>

    <!-- boutons de vente -->
    <section class="cz-app" hidden>
      <div class="cz__head">
        <div>
          <p class="kicker reveal">Cassa</p>
          <h1 class="h2" data-split>Qu'est-ce qu'on <em>sert ?</em></h1>
        </div>
        <p class="cz__hint reveal">Un clic = un QR à usage unique, valable 2 minutes. Le client le scanne avec « Mes points ».</p>
      </div>
      <div class="cz__grid cz__grid--sale"></div>

      <div class="cz__sep">
        <button class="btn btn--line-dark cz-reward-toggle magnetic" type="button" aria-expanded="false" aria-controls="cz-rewards"><svg class="btn__ic" aria-hidden="true"><use href="#i-gift"/></svg><span class="btn__t">Utiliser une récompense</span></button>
      </div>
      <div class="cz__grid cz__grid--reward" id="cz-rewards" hidden></div>
    </section>
  </main>

  <!-- QR à scanner -->
  <div class="cz-qr" hidden role="dialog" aria-modal="true" aria-labelledby="czq-t">
    <div class="cz-qr__card">
      <p class="cz-qr__kick" id="czq-t"></p>
      <p class="cz-qr__label"></p>
      <div class="cz-qr__code"></div>
      <p class="cz-qr__short">Code manuel : <b></b></p>
      <div class="cz-qr__timer"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="cz-qr__track"/><circle cx="22" cy="22" r="19" class="cz-qr__ring" pathLength="1"/></svg><span class="cz-qr__time">2:00</span></div>
      <p class="cz-qr__status" aria-live="polite">En attente du scan…</p>
      <div class="cz-qr__done" aria-live="assertive">
        <span class="cz-qr__check"><svg aria-hidden="true"><use href="#i-check"/></svg></span>
        <p class="cz-qr__done-t"></p>
        <p class="cz-qr__done-s"></p>
      </div>
      <div class="cz-qr__ctas">
        <button class="btn btn--line-dark cz-qr__cancel" type="button"><span class="btn__t">Annuler</span></button>
        <button class="btn btn--wine cz-qr__again" type="button" hidden><span class="btn__t">Regénérer</span></button>
        <button class="btn btn--yellow cz-qr__next" type="button" hidden><span class="btn__t">Client suivant</span></button>
      </div>
    </div>
  </div>

  <script src="../assets/js/fidelite-nav.js" defer></script>

  <script src="../assets/js/art.js" defer></script>
